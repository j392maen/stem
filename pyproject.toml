[project]
name = "stemapp"
version = "0.1.0"
description = "個人用の楽曲 stem 分割・再生アプリ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = [
    "audio-separator[gpu]>=0.30",
    # librosa 1.0 で audioread が必須依存から外れたが、audio-separator が import する
    "audioread>=3.0",
    "torch>=2.7",
    # onnx2torch 経由で入る torchvision も torch と同じ CUDA 版 index から取る
    "torchvision",
    # 拍・小節の頭の検出（T10）。beat_this は torchaudio を先頭で import する。
    # torchaudio は 2.11 が最後の版。torch と同じ版・同じ CUDA 版 index から取る
    "beat-this>=1.1",
    "torchaudio>=2.11",
]
url = [
    "yt-dlp",
]

[project.scripts]
stemapp = "stemapp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemapp"]

[tool.uv]
# 開発・実行は Windows、CI 相当は Linux。macOS 用の解決は行わない。
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not browser'"
markers = [
    "gpu: 実 GPU（CUDA）が必要なテスト。`uv run pytest -m gpu` で実行する",
    "ffmpeg: ffmpeg コマンドが必要なテスト",
    "browser: PC の Microsoft Edge（Playwright）で画面を動かすテスト。`uv run pytest -m browser` で実行する",
]
